name: T0 Cold HLAE Binary Oracle v1.1.4

on:
  push:
    branches:
      - research/t0-gpu-transport-direction-audit-v2
    paths:
      - .github/workflows/t0-cold-hlae-binary-oracle-v114.yml
      - experiments/t0_hlae_rt_primitive_oracle/scripts/CsgovrHlaeRtPrimitiveProbeV114.java
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/t0-cold-hlae-binary-oracle-v114.yml
      - experiments/t0_hlae_rt_primitive_oracle/scripts/CsgovrHlaeRtPrimitiveProbeV114.java
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t0-cold-hlae-v114-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  corrected-exact-binary-oracle:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      EXPECTED_AFX_SHA256: 5B9D13AE9ABFFEEF80851E10861302162A47D1B43D8483B4A8FCEC7EAA19B035
      HLAE_TAG: v2.191.1
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve exact official HLAE binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'hlae_assets'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $release = (gh api "repos/advancedfx/advancedfx/releases/tags/$env:HLAE_TAG" | ConvertFrom-Json)
          $found = $null
          $assetName = $null
          foreach ($asset in @($release.assets | Where-Object { $_.name -match '(?i)\.zip$' })) {
            $zip = Join-Path $root $asset.name
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
            $extract = Join-Path $root ([IO.Path]::GetFileNameWithoutExtension($asset.name))
            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
            foreach ($dll in (Get-ChildItem -LiteralPath $extract -Filter 'AfxHookSource.dll' -File -Recurse -ErrorAction SilentlyContinue)) {
              $hash = (Get-FileHash -LiteralPath $dll.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
              Write-Host ('[CANDIDATE] ' + $hash + ' ' + $dll.FullName)
              if ($hash -eq $env:EXPECTED_AFX_SHA256) { $found = $dll; $assetName = $asset.name; break }
            }
            if ($found) { break }
          }
          if (-not $found) { throw 'Exact pinned AfxHookSource.dll not found in official v2.191.1 ZIP assets.' }
          ('AFX_EXACT=' + $found.FullName) | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          ('HLAE_ASSET_NAME=' + $assetName) | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download official Ghidra
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = (gh api 'repos/NationalSecurityAgency/ghidra/releases/latest' | ConvertFrom-Json)
          $asset = $release.assets | Where-Object { $_.name -match '(?i)PUBLIC.*\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw 'Official Ghidra PUBLIC ZIP not found.' }
          $zip = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          $root = Join-Path $env:RUNNER_TEMP 'ghidra'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $headless = Get-ChildItem -LiteralPath $root -Filter analyzeHeadless.bat -File -Recurse | Select-Object -ExpandProperty FullName -First 1
          if (-not $headless) { throw 'analyzeHeadless.bat not found.' }
          ('GHIDRA_HEADLESS=' + $headless) | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          ('GHIDRA_TAG=' + $release.tag_name) | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run corrected v1.1.4 oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Join-Path $env:GITHUB_WORKSPACE '_ci_t0_hlae_v114'
          $project = Join-Path $env:RUNNER_TEMP 'ghidra_project_v114'
          New-Item -ItemType Directory -Force -Path $result,$project | Out-Null
          $scan = Join-Path $result 'HLAE_RT_PRIMITIVE_SCAN_V114.txt'
          $log = Join-Path $result 'GHIDRA_HEADLESS.log'
          $scriptDir = Join-Path $env:GITHUB_WORKSPACE 'experiments\t0_hlae_rt_primitive_oracle\scripts'
          $args = @($project,'csgovr_t0_v114','-import',$env:AFX_EXACT,'-overwrite','-scriptPath',$scriptDir,'-postScript','CsgovrHlaeRtPrimitiveProbeV114.java',$scan,'-deleteProject')
          $saved = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try { & $env:GHIDRA_HEADLESS @args 2>&1 | Tee-Object -FilePath $log; $ec=$LASTEXITCODE } finally { $ErrorActionPreference=$saved }
          if ($ec -ne 0) { throw ('Ghidra exit code ' + $ec) }
          if (-not (Select-String -LiteralPath $scan -SimpleMatch 'SCAN_COMPLETE=YES' -Quiet)) { throw 'v1.1.4 scan incomplete.' }
          @(
            'EvidenceLabel=STATIC-AUDITED / NOT LIVE-PROVEN',
            'OracleVersion=1.1.4',
            ('HLAEAsset=' + $env:HLAE_ASSET_NAME),
            ('AfxHookSourceSHA256=' + ((Get-FileHash -LiteralPath $env:AFX_EXACT -Algorithm SHA256).Hash.ToUpperInvariant())),
            ('GhidraTag=' + $env:GHIDRA_TAG),
            ('SourceCommit=' + $env:SOURCE_SHA),
            'GameLaunched=NO','HLAELaunched=NO','Injection=NO','BinaryPatched=NO'
          ) | Set-Content -LiteralPath (Join-Path $result 'INPUT_IDENTITY.txt') -Encoding UTF8

      - name: Build compact v1.1.4 result
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Join-Path $env:GITHUB_WORKSPACE '_ci_t0_hlae_v114'
          $scan = Join-Path $result 'HLAE_RT_PRIMITIVE_SCAN_V114.txt'
          $text = Get-Content -LiteralPath $scan -Raw
          function V([string]$k) { $m=[regex]::Match($text,'(?m)^'+[regex]::Escape($k)+'=(.*)$'); if($m.Success){$m.Groups[1].Value.Trim()}else{'MISSING'} }
          @(
            'CSGOVR T0 HLAE COLD CI v1.1.4',
            'EvidenceLabel=STATIC-AUDITED / NOT LIVE-PROVEN',
            ('SourceCommit=' + $env:SOURCE_SHA),
            ('SemanticVerdict=' + (V 'SemanticVerdict')),
            ('BoundedCoreFinalists=' + (V 'BoundedCoreFinalists')),
            ('BestPushMemberRVA=' + (V 'BestPushMemberRVA')),
            ('BestPushMemberSigHex=' + (V 'BestPushMemberSigHex')),
            ('BestPopMemberRVA=' + (V 'BestPopMemberRVA')),
            ('BestPopMemberSigHex=' + (V 'BestPopMemberSigHex')),
            ('BestGpuWaitMemberRVA=' + (V 'BestGpuWaitMemberRVA')),
            ('BestGpuWaitMemberSigHex=' + (V 'BestGpuWaitMemberSigHex')),
            'KnownV113FalsePositive=0x36150 R32F helper, not PushRT',
            'PromotionPolicy=NO AUTO PROMOTION; exact-source review remains mandatory.',
            'RuntimeAuthorization=NO'
          ) | Set-Content -LiteralPath (Join-Path $result 'ROLE_SUMMARY_V114.txt') -Encoding UTF8
          ('FullScanSHA256=' + ((Get-FileHash -LiteralPath $scan -Algorithm SHA256).Hash.ToUpperInvariant())) | Set-Content -LiteralPath (Join-Path $result 'FULL_SCAN_SHA256.txt') -Encoding UTF8

      - name: Upload v1.1.4 COLD artifact
        uses: actions/upload-artifact@v4
        with:
          name: csgovr-t0-hlae-v114-${{ github.run_id }}
          path: _ci_t0_hlae_v114/
          if-no-files-found: error
          retention-days: 14

      - name: Commit compact v1.1.4 result
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:GITHUB_WORKSPACE '_ci_t0_hlae_v114'
          $dst = Join-Path $env:GITHUB_WORKSPACE ('research\ci_results\T0_HLAE_COLD_CI_V114\' + $env:SOURCE_SHA)
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          foreach($n in @('INPUT_IDENTITY.txt','ROLE_SUMMARY_V114.txt','FULL_SCAN_SHA256.txt')) { Copy-Item (Join-Path $src $n) (Join-Path $dst $n) -Force }
          git config user.name 'csgovr-cold-oracle-bot'
          git config user.email 'csgovr-cold-oracle-bot@users.noreply.github.com'
          git add -- 'research/ci_results/T0_HLAE_COLD_CI_V114'
          if ((git diff --cached --name-only).Length -eq 0) { exit 0 }
          git commit -m "COLD RESULT v1.1.4: exact HLAE RT oracle $env:SOURCE_SHA"
          git pull --rebase origin $env:TARGET_BRANCH
          git push origin "HEAD:$env:TARGET_BRANCH"
