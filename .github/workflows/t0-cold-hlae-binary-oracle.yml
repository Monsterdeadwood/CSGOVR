name: T0 Cold HLAE Binary Oracle

on:
  push:
    branches:
      - research/t0-gpu-transport-direction-audit-v2
    paths:
      - .github/workflows/t0-cold-hlae-binary-oracle.yml
      - experiments/t0_hlae_rt_primitive_oracle/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/t0-cold-hlae-binary-oracle.yml
      - experiments/t0_hlae_rt_primitive_oracle/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t0-cold-hlae-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  exact-binary-static-oracle:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      EXPECTED_AFX_SHA256: 5B9D13AE9ABFFEEF80851E10861302162A47D1B43D8483B4A8FCEC7EAA19B035
      HLAE_TAG: v2.191.1
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

    steps:
      - name: Checkout CSGOVR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up JDK 21 for Ghidra
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve exact HLAE 2.191.1 binary from official release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'hlae_release_assets'
          New-Item -ItemType Directory -Force -Path $downloadRoot | Out-Null

          $release = (gh api "repos/advancedfx/advancedfx/releases/tags/$env:HLAE_TAG" | ConvertFrom-Json)
          $zipAssets = @($release.assets | Where-Object { $_.name -match '(?i)\.zip$' })
          if ($zipAssets.Count -eq 0) {
            $release.assets | ForEach-Object { Write-Host ('[ASSET] ' + $_.name) }
            throw 'Official HLAE release exposes no ZIP asset.'
          }

          $found = $null
          $foundAsset = $null
          foreach ($asset in $zipAssets) {
            Write-Host ('[DOWNLOAD] ' + $asset.name)
            $zip = Join-Path $downloadRoot $asset.name
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
            $extract = Join-Path $downloadRoot ([IO.Path]::GetFileNameWithoutExtension($asset.name))
            if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force

            foreach ($dll in (Get-ChildItem -LiteralPath $extract -Filter 'AfxHookSource.dll' -File -Recurse -ErrorAction SilentlyContinue)) {
              $h = (Get-FileHash -LiteralPath $dll.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
              Write-Host ('[CANDIDATE] ' + $h + '  ' + $dll.FullName)
              if ($h -eq $env:EXPECTED_AFX_SHA256) {
                $found = $dll
                $foundAsset = $asset.name
                break
              }
            }
            if ($found) { break }
          }

          if (-not $found) { throw 'Exact pinned AfxHookSource.dll hash not found in official HLAE 2.191.1 ZIP assets.' }
          Write-Host ('[EXACT] ' + $found.FullName)
          Write-Host ('[ASSET] ' + $foundAsset)
          ('AFX_EXACT=' + $found.FullName) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ('HLAE_ASSET_NAME=' + $foundAsset) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download official Ghidra release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = (gh api 'repos/NationalSecurityAgency/ghidra/releases/latest' | ConvertFrom-Json)
          $asset = $release.assets | Where-Object { $_.name -match '(?i)PUBLIC.*\.zip$' } | Select-Object -First 1
          if (-not $asset) {
            $release.assets | ForEach-Object { Write-Host ('[GHIDRA ASSET] ' + $_.name) }
            throw 'Could not resolve official Ghidra PUBLIC ZIP asset.'
          }
          $zip = Join-Path $env:RUNNER_TEMP $asset.name
          Write-Host ('[DOWNLOAD] Ghidra ' + $release.tag_name + ' / ' + $asset.name)
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          $root = Join-Path $env:RUNNER_TEMP 'ghidra_exact'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $headless = Get-ChildItem -LiteralPath $root -Filter 'analyzeHeadless.bat' -File -Recurse | Select-Object -ExpandProperty FullName -First 1
          if (-not $headless) { throw 'analyzeHeadless.bat missing after Ghidra extraction.' }
          Write-Host ('[GHIDRA] ' + $headless)
          ('GHIDRA_HEADLESS=' + $headless) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ('GHIDRA_TAG=' + $release.tag_name) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run source-guided exact-binary oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Join-Path $env:GITHUB_WORKSPACE '_ci_t0_hlae_cold_result'
          $project = Join-Path $env:RUNNER_TEMP 'ghidra_project'
          New-Item -ItemType Directory -Force -Path $result,$project | Out-Null
          $scan = Join-Path $result 'HLAE_RT_PRIMITIVE_SCAN.txt'
          $log = Join-Path $result 'GHIDRA_HEADLESS.log'
          $scriptDir = Join-Path $env:GITHUB_WORKSPACE 'experiments\t0_hlae_rt_primitive_oracle\scripts'
          $args = @(
            $project,
            'csgovr_t0_hlae_ci',
            '-import', $env:AFX_EXACT,
            '-overwrite',
            '-scriptPath', $scriptDir,
            '-postScript', 'CsgovrHlaeRtPrimitiveProbe.java', $scan,
            '-deleteProject'
          )

          $saved = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            & $env:GHIDRA_HEADLESS @args 2>&1 | Tee-Object -FilePath $log
            $ec = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $saved
          }
          if ($ec -ne 0) { throw ('Ghidra headless exit code ' + $ec) }
          if (-not (Test-Path -LiteralPath $scan)) { throw 'Oracle scan output missing.' }
          if (-not (Select-String -LiteralPath $scan -SimpleMatch 'SCAN_COMPLETE=YES' -Quiet)) { throw 'Oracle scan did not complete.' }

          $afxHash = (Get-FileHash -LiteralPath $env:AFX_EXACT -Algorithm SHA256).Hash.ToUpperInvariant()
          @(
            'EvidenceLabel=STATIC-AUDITED / NOT LIVE-PROVEN',
            'Source=official advancedfx GitHub release asset',
            ('HLAETag=' + $env:HLAE_TAG),
            ('HLAEAsset=' + $env:HLAE_ASSET_NAME),
            ('AfxHookSourceSHA256=' + $afxHash),
            ('ExpectedAfxHookSourceSHA256=' + $env:EXPECTED_AFX_SHA256),
            ('GhidraTag=' + $env:GHIDRA_TAG),
            ('SourceCommit=' + $env:SOURCE_SHA),
            'GameLaunched=NO',
            'HLAELaunched=NO',
            'Injection=NO',
            'BinaryPatched=NO'
          ) | Set-Content -LiteralPath (Join-Path $result 'INPUT_IDENTITY.txt') -Encoding UTF8
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'experiments\t0_hlae_rt_primitive_oracle\PREFLIGHT.txt') -Destination (Join-Path $result 'PREFLIGHT.txt')

      - name: Build compact source-review result
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Join-Path $env:GITHUB_WORKSPACE '_ci_t0_hlae_cold_result'
          $scan = Join-Path $result 'HLAE_RT_PRIMITIVE_SCAN.txt'
          $text = Get-Content -LiteralPath $scan -Raw

          function Get-Rva([string]$Key) {
            $m = [regex]::Match($text, '(?m)^' + [regex]::Escape($Key) + '=(0x[0-9A-Fa-f]+)')
            if ($m.Success) { return $m.Groups[1].Value }
            return 'NONE'
          }
          function Get-Value([string]$Key) {
            $m = [regex]::Match($text, '(?m)^' + [regex]::Escape($Key) + '=(.*)$')
            if ($m.Success) { return $m.Groups[1].Value.Trim() }
            return 'MISSING'
          }
          function Get-RoleBlock([string]$Role) {
            $blocks = [regex]::Split($text, '(?m)^={32,}\s*$')
            foreach ($b in $blocks) {
              if ($b -match ('(?m)^SourceRoleHint=' + [regex]::Escape($Role) + '\s*$')) { return $b.Trim() }
            }
            return 'NO_CANDIDATE_BLOCK'
          }
          function Get-WrapperField([string]$Role,[string]$Field) {
            $b = Get-RoleBlock $Role
            if ($b -eq 'NO_CANDIDATE_BLOCK') { return 'NONE' }
            $m = [regex]::Match($b, '(?m)^\s+RVA=(0x[0-9A-Fa-f]+).*?SigLen=(\d+)\s+SigHex=([0-9A-Fa-f]+)\s*$')
            if (-not $m.Success) { return 'NONE' }
            if ($Field -eq 'RVA') { return $m.Groups[1].Value }
            if ($Field -eq 'SIG') { return $m.Groups[3].Value.ToUpperInvariant() }
            return 'NONE'
          }

          $pushWrapper = Get-WrapperField 'RT_PUSH_MEMBER_FINALIST' 'RVA'
          $pushSig = Get-WrapperField 'RT_PUSH_MEMBER_FINALIST' 'SIG'
          $popWrapper = Get-WrapperField 'RT_POP_MEMBER_FINALIST' 'RVA'
          $popSig = Get-WrapperField 'RT_POP_MEMBER_FINALIST' 'SIG'
          $waitWrapper = Get-WrapperField 'GPU_WAIT_MEMBER_FINALIST' 'RVA'
          $waitSig = Get-WrapperField 'GPU_WAIT_MEMBER_FINALIST' 'SIG'

          @(
            'CSGOVR T0 HLAE COLD CI ROLE SUMMARY',
            'EvidenceLabel=STATIC-AUDITED / NOT LIVE-PROVEN',
            ('SourceCommit=' + $env:SOURCE_SHA),
            ('SemanticVerdict=' + (Get-Value 'SemanticVerdict')),
            ('BoundedCoreFinalists=' + (Get-Value 'BoundedCoreFinalists')),
            ('BestPushMemberRVA=' + (Get-Rva 'BestPushMemberRVA')),
            ('BestPushThinCallerRVA=' + $pushWrapper),
            ('BestPushThinCallerSigHex=' + $pushSig),
            ('BestPopMemberRVA=' + (Get-Rva 'BestPopMemberRVA')),
            ('BestPopThinCallerRVA=' + $popWrapper),
            ('BestPopThinCallerSigHex=' + $popSig),
            ('BestGpuWaitMemberRVA=' + (Get-Rva 'BestGpuWaitMemberRVA')),
            ('BestGpuWaitThinCallerRVA=' + $waitWrapper),
            ('BestGpuWaitThinCallerSigHex=' + $waitSig),
            'PromotionPolicy=NO AUTO PROMOTION; inspect committed finalist decompiles against pinned source.',
            'RuntimeAuthorization=NO'
          ) | Set-Content -LiteralPath (Join-Path $result 'ROLE_SUMMARY.txt') -Encoding UTF8

          Get-RoleBlock 'RT_PUSH_MEMBER_FINALIST' | Set-Content -LiteralPath (Join-Path $result 'PUSH_FINALIST.txt') -Encoding UTF8
          Get-RoleBlock 'RT_POP_MEMBER_FINALIST' | Set-Content -LiteralPath (Join-Path $result 'POP_FINALIST.txt') -Encoding UTF8
          Get-RoleBlock 'GPU_WAIT_MEMBER_FINALIST' | Set-Content -LiteralPath (Join-Path $result 'GPU_WAIT_FINALIST.txt') -Encoding UTF8
          $scanHash = (Get-FileHash -LiteralPath $scan -Algorithm SHA256).Hash.ToUpperInvariant()
          ('FullScanSHA256=' + $scanHash) | Set-Content -LiteralPath (Join-Path $result 'FULL_SCAN_SHA256.txt') -Encoding UTF8

      - name: Upload full COLD result artifact
        uses: actions/upload-artifact@v4
        with:
          name: csgovr-t0-hlae-cold-${{ github.run_id }}
          path: _ci_t0_hlae_cold_result/
          if-no-files-found: error
          retention-days: 14

      - name: Commit compact COLD review result to research branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Join-Path $env:GITHUB_WORKSPACE '_ci_t0_hlae_cold_result'
          $dest = Join-Path $env:GITHUB_WORKSPACE ('research\ci_results\T0_HLAE_COLD_CI\' + $env:SOURCE_SHA)
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          foreach ($name in @('INPUT_IDENTITY.txt','PREFLIGHT.txt','ROLE_SUMMARY.txt','PUSH_FINALIST.txt','POP_FINALIST.txt','GPU_WAIT_FINALIST.txt','FULL_SCAN_SHA256.txt')) {
            Copy-Item -LiteralPath (Join-Path $result $name) -Destination (Join-Path $dest $name) -Force
          }

          git config user.name 'csgovr-cold-oracle-bot'
          git config user.email 'csgovr-cold-oracle-bot@users.noreply.github.com'
          git add -- 'research/ci_results/T0_HLAE_COLD_CI'
          if ((git diff --cached --name-only).Length -eq 0) {
            Write-Host '[INFO] Compact result already committed.'
            exit 0
          }
          git commit -m "COLD RESULT: exact HLAE RT oracle $env:SOURCE_SHA"
          git pull --rebase origin $env:TARGET_BRANCH
          git push origin "HEAD:$env:TARGET_BRANCH"
