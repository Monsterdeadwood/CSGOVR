name: T0 Cold HLAE Binary Oracle

on:
  push:
    branches:
      - research/t0-gpu-transport-direction-audit-v2
    paths:
      - .github/workflows/t0-cold-hlae-binary-oracle.yml
      - experiments/t0_hlae_rt_primitive_oracle/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-binary-static-oracle:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      EXPECTED_AFX_SHA256: 5B9D13AE9ABFFEEF80851E10861302162A47D1B43D8483B4A8FCEC7EAA19B035
      HLAE_TAG: v2.191.1
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout CSGOVR branch
        uses: actions/checkout@v4

      - name: Set up JDK 21 for Ghidra
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve exact HLAE 2.191.1 binary from official release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'hlae_release_assets'
          New-Item -ItemType Directory -Force -Path $downloadRoot | Out-Null

          $release = (gh api "repos/advancedfx/advancedfx/releases/tags/$env:HLAE_TAG" | ConvertFrom-Json)
          $zipAssets = @($release.assets | Where-Object { $_.name -match '(?i)\.zip$' })
          if ($zipAssets.Count -eq 0) {
            $release.assets | ForEach-Object { Write-Host ('[ASSET] ' + $_.name) }
            throw 'Official HLAE release exposes no ZIP asset.'
          }

          $found = $null
          $foundAsset = $null
          foreach ($asset in $zipAssets) {
            Write-Host ('[DOWNLOAD] ' + $asset.name)
            $zip = Join-Path $downloadRoot $asset.name
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
            $extract = Join-Path $downloadRoot ([IO.Path]::GetFileNameWithoutExtension($asset.name))
            if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force

            foreach ($dll in (Get-ChildItem -LiteralPath $extract -Filter 'AfxHookSource.dll' -File -Recurse -ErrorAction SilentlyContinue)) {
              $h = (Get-FileHash -LiteralPath $dll.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
              Write-Host ('[CANDIDATE] ' + $h + '  ' + $dll.FullName)
              if ($h -eq $env:EXPECTED_AFX_SHA256) {
                $found = $dll
                $foundAsset = $asset.name
                break
              }
            }
            if ($found) { break }
          }

          if (-not $found) { throw 'Exact pinned AfxHookSource.dll hash not found in official HLAE 2.191.1 ZIP assets.' }
          Write-Host ('[EXACT] ' + $found.FullName)
          Write-Host ('[ASSET] ' + $foundAsset)
          ('AFX_EXACT=' + $found.FullName) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ('HLAE_ASSET_NAME=' + $foundAsset) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download official Ghidra release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = (gh api 'repos/NationalSecurityAgency/ghidra/releases/latest' | ConvertFrom-Json)
          $asset = $release.assets | Where-Object { $_.name -match '(?i)PUBLIC.*\.zip$' } | Select-Object -First 1
          if (-not $asset) {
            $release.assets | ForEach-Object { Write-Host ('[GHIDRA ASSET] ' + $_.name) }
            throw 'Could not resolve official Ghidra PUBLIC ZIP asset.'
          }
          $zip = Join-Path $env:RUNNER_TEMP $asset.name
          Write-Host ('[DOWNLOAD] Ghidra ' + $release.tag_name + ' / ' + $asset.name)
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          $root = Join-Path $env:RUNNER_TEMP 'ghidra_exact'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $headless = Get-ChildItem -LiteralPath $root -Filter 'analyzeHeadless.bat' -File -Recurse | Select-Object -ExpandProperty FullName -First 1
          if (-not $headless) { throw 'analyzeHeadless.bat missing after Ghidra extraction.' }
          Write-Host ('[GHIDRA] ' + $headless)
          ('GHIDRA_HEADLESS=' + $headless) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ('GHIDRA_TAG=' + $release.tag_name) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run source-guided exact-binary oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Join-Path $env:GITHUB_WORKSPACE '_ci_t0_hlae_cold_result'
          $project = Join-Path $env:RUNNER_TEMP 'ghidra_project'
          New-Item -ItemType Directory -Force -Path $result,$project | Out-Null
          $scan = Join-Path $result 'HLAE_RT_PRIMITIVE_SCAN.txt'
          $log = Join-Path $result 'GHIDRA_HEADLESS.log'
          $scriptDir = Join-Path $env:GITHUB_WORKSPACE 'experiments\t0_hlae_rt_primitive_oracle\scripts'
          $args = @(
            $project,
            'csgovr_t0_hlae_ci',
            '-import', $env:AFX_EXACT,
            '-overwrite',
            '-scriptPath', $scriptDir,
            '-postScript', 'CsgovrHlaeRtPrimitiveProbe.java', $scan,
            '-deleteProject'
          )

          $saved = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            & $env:GHIDRA_HEADLESS @args 2>&1 | Tee-Object -FilePath $log
            $ec = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $saved
          }
          if ($ec -ne 0) { throw ('Ghidra headless exit code ' + $ec) }
          if (-not (Test-Path -LiteralPath $scan)) { throw 'Oracle scan output missing.' }
          if (-not (Select-String -LiteralPath $scan -SimpleMatch 'SCAN_COMPLETE=YES' -Quiet)) { throw 'Oracle scan did not complete.' }

          $afxHash = (Get-FileHash -LiteralPath $env:AFX_EXACT -Algorithm SHA256).Hash.ToUpperInvariant()
          @(
            'EvidenceLabel=STATIC-AUDITED / NOT LIVE-PROVEN',
            'Source=official advancedfx GitHub release asset',
            ('HLAETag=' + $env:HLAE_TAG),
            ('HLAEAsset=' + $env:HLAE_ASSET_NAME),
            ('AfxHookSourceSHA256=' + $afxHash),
            ('ExpectedAfxHookSourceSHA256=' + $env:EXPECTED_AFX_SHA256),
            ('GhidraTag=' + $env:GHIDRA_TAG),
            ('CSGOVRCommit=' + $env:GITHUB_SHA),
            'GameLaunched=NO',
            'HLAELaunched=NO',
            'Injection=NO',
            'BinaryPatched=NO'
          ) | Set-Content -LiteralPath (Join-Path $result 'INPUT_IDENTITY.txt') -Encoding UTF8
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'experiments\t0_hlae_rt_primitive_oracle\PREFLIGHT.txt') -Destination (Join-Path $result 'PREFLIGHT.txt')

      - name: Upload compact COLD result
        uses: actions/upload-artifact@v4
        with:
          name: csgovr-t0-hlae-cold-${{ github.run_id }}
          path: _ci_t0_hlae_cold_result/
          if-no-files-found: error
          retention-days: 14
